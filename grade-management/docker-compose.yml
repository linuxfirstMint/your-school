services:
  # 1. データベース (MySQL)
  db:
    image: mysql:8.0.36
    container_name: grade-management-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - grade-management-network

  # 2. バックエンド API (PHP + Apache)
  api:
    build: ./api
    container_name: grade-management-api
    ports:
      - "${API_PORT}:80"
    volumes:
      - ./api/src:/var/www/html
    # コンテナ内のPHPから環境変数として参照できるようにする
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - grade-management-network

  # 3. フロントエンド (Nginx)
  frontend:
    image: nginx:1.25.4-alpine
    container_name: grade-management-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html
    networks:
      - grade-management-network

networks:
  grade-management-network:
    driver: bridge
