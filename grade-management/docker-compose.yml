services:
  # 1. データベース (MySQL)
  db:
    image: mysql:8.0.36
    container_name: grade-management-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=${DB_CHARSET} --collation-server=${DB_COLLATION} --skip-character-set-client-handshake
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - grade-management-network

  # 2. Web (PHP + Apache) ── HTML/CSS/JS と API を一括で配信
  web:
    build: ./web
    container_name: grade-management-web
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./web/src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - grade-management-network

networks:
  grade-management-network:
    driver: bridge
