name: CI

on:
  push:
    branches: [dev/hotel-reservation, main]
  pull_request:
    branches: [dev/hotel-reservation, main]

jobs:
  lint-and-analyse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-reservation/src

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP CS Fixer
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: php vendor/bin/phpstan analyse

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-reservation/src

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password

  deploy:
    needs: [lint-and-analyse, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/hotel-reservation'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/hotel-reservation
            git pull origin dev/hotel-reservation
            cd hotel-reservation/src
            sudo chown -R "$(whoami)":www-data bootstrap/cache storage
            sudo chmod -R 775 bootstrap/cache storage
            COMPOSER_PROCESS_TIMEOUT=600 composer install --optimize-autoloader
            npm install
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo systemctl reload php8.5-fpm
